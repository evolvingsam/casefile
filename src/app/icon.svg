<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181320" />
      <stop offset="100%" stop-color="#0a080f" />
    </radialGradient>
    
    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e09f3e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e09f3e" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson Glow -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e2a2b" />
      <stop offset="100%" stop-color="#540b0e" />
    </linearGradient>

    <!-- Glass Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e09f3e" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#2a2235" stroke-width="8" />

  <!-- Ambient Glow Behind Magnifying Glass -->
  <circle cx="260" cy="230" r="160" fill="url(#amberGlow)" opacity="0.4" />

  <g filter="url(#dropShadow)">
    <!-- Case File Folder Outline -->
    <path d="M 120 160 L 210 160 L 240 190 L 390 190 C 405 190 415 200 415 215 L 415 370 C 415 385 405 395 390 395 L 120 395 C 105 395 95 385 95 370 L 95 185 C 95 170 105 160 120 160 Z" 
          fill="#130e1a" 
          stroke="#e09f3e" 
          stroke-width="10" 
          stroke-linejoin="round"
          opacity="0.9" />

    <!-- Classified Stamp / Lines inside Folder -->
    <line x1="135" y1="240" x2="230" y2="240" stroke="#9e2a2b" stroke-width="8" stroke-linecap="round" />
    <line x1="135" y1="270" x2="270" y2="270" stroke="#4a3e56" stroke-width="6" stroke-linecap="round" />
    <line x1="135" y1="300" x2="220" y2="300" stroke="#4a3e56" stroke-width="6" stroke-linecap="round" />

    <!-- Detective Magnifying Glass -->
    <!-- Lens Ring -->
    <circle cx="295" cy="245" r="95" fill="url(#lensGrad)" stroke="#e09f3e" stroke-width="18" />

    <!-- Lens Glint -->
    <path d="M 235 210 A 75 75 0 0 1 325 175" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6" />

    <!-- Handle -->
    <line x1="365" y1="315" x2="435" y2="385" stroke="#e09f3e" stroke-width="24" stroke-linecap="round" />
    <line x1="365" y1="315" x2="435" y2="385" stroke="#9e2a2b" stroke-width="12" stroke-linecap="round" />

    <!-- AI Spark Dot inside Lens -->
    <circle cx="295" cy="245" r="14" fill="#ffffff" />
    <circle cx="295" cy="245" r="28" fill="#e09f3e" opacity="0.5" />
  </g>
</svg>
